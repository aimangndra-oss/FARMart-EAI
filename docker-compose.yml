version: '3.8'

services:
  # Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Databases
  pos-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pos_db
    ports:
      - "5432:5432"
    volumes:
      - pos_db_data:/var/lib/postgresql/data
      - ./init-scripts/pos.sql:/docker-entrypoint-initdb.d/init.sql

  inventory-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    volumes:
      - inventory_db_data:/var/lib/mysql
      - ./init-scripts/inventory.sql:/docker-entrypoint-initdb.d/init.sql

  accounting-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: accounting_db
    ports:
      - "5433:5432"
    volumes:
      - accounting_db_data:/var/lib/postgresql/data
      - ./init-scripts/accounting.sql:/docker-entrypoint-initdb.d/init.sql

  # Microservices
  pos-service:
    build: ./pos-service
    environment:
      - PORT=3001
      - DB_HOST=pos-db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=pos_db
      - DB_PORT=5432
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_NAME=farmart_events
    depends_on:
      rabbitmq:
        condition: service_healthy
      pos-db:
        condition: service_started

  inventory-service:
    build: ./inventory-service
    environment:
      - PORT=3002
      - DB_HOST=inventory-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=inventory_db
    depends_on:
      inventory-db:
        condition: service_started

  accounting-service:
    build: ./accounting-service
    environment:
      - PORT=3003
      - DB_HOST=accounting-db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=accounting_db
      - DB_PORT=5432
    depends_on:
      accounting-db:
        condition: service_started

  integration-service:
    build: ./integration-service
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - EXCHANGE_NAME=farmart_events
      - INVENTORY_API=http://inventory-service:3002/inventory/update
      - ACCOUNTING_API=http://accounting-service:3003/accounting/journal
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started
      accounting-service:
        condition: service_started

  # API Gateway
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - pos-service
      - inventory-service
      - accounting-service
      - frontend

  # Frontend Web App
  frontend:
    build: ./frontend
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  rabbitmq_data:
  pos_db_data:
  inventory_db_data:
  accounting_db_data:
